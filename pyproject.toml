[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "inkbound-realms"
version = "0.2.0"
description = "Book-authored, package-driven Inkbound Realms RPG"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.10,<3", "pygame>=2.6,<3", "numpy>=1.26,<3", "pypdf>=4,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "jsonschema>=4.23,<5", "libarchive-c>=5,<6"]

[project.scripts]
inkbound = "inkbound.cli:main"

[tool.setuptools.packages.find]
include = ["inkbound*", "legacy*"]

[tool.setuptools.package-data]
"legacy.ascii_rpg" = ["config.json", "books/sample.txt", "README.md", "requirements.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
